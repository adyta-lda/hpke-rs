[package]
name = "hpke-rs-libcrux"
version = "0.8.0"
authors = ["Franziskus Kiefer <franziskuskiefer@gmail.com>"]
edition = "2021"
license = "MPL-2.0"
documentation = "https://docs.rs/hpke-rs-libcrux"
description = "Crypto backend for HPKE using formally verified code from libcrux."
readme = "Readme.md"
repository = "https://github.com/celabshq/libcrux"

[dependencies]
hpke-rs-crypto = { version = "=0.8.0", default-features = false }
libcrux-ecdh = { version = "=0.0.9", default-features = false }
libcrux-hkdf = { version = "=0.0.9" }
libcrux-kem = { version = "=0.0.10", default-features = false }
libcrux-aead = { version = "=0.0.10" }
libcrux-sha3 = { version = "=0.0.11" }
libcrux-traits = { version = "=0.0.9" }
libcrux-hmac-drbg = { version = "=0.0.2", features = ["rand"] }
libcrux-p384 = { version = "=0.0.1", default-features = false, features = ["rand"] }
# RustCrypto curves not available in libcrux
# TODO: This should be replaced with a libcrux implementation as soon as it is
# available.
p521 = { version = "0.14.0", features = [
    "arithmetic",
    "ecdh",
], default-features = false, optional = true }
# Randomness
rand = { version = "0.10", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# `--all-features` does not build: `draft-connolly-cfrg-hpke-mlkem` and
# `draft-ietf-hpke-pq` are mutually exclusive. Pin a working set for docs.rs.
[package.metadata.docs.rs]
no-default-features = true
features = ["std", "draft-ietf-hpke-pq"]

[features]
default = ["sys-rng"]
# Enables the system-RNG-backed default PRNG (`HpkeLibcruxPrng::try_new`, and with it
# `HpkeDefaultPrng` for `HpkeLibcrux`, i.e. `Hpke::<HpkeLibcrux>::new`), using `rand`'s
# `sys_rng` (backed by `getrandom`). Disable this for a build with no configured entropy
# backend (a bare embedded target, or a wasm build without a `getrandom` backend), and
# construct the PRNG via `HpkeLibcruxPrng::try_from_seed` or bring your own `TryCryptoRng`.
#
# Incompatible with `libcrux-hmac-drbg/health-tests`: the auto-reseeding DRBG this uses
# (`HmacSha256DrbgRng`) is not available when that feature is enabled anywhere in the build.
sys-rng = ["libcrux-hmac-drbg/sys_rng", "rand/sys_rng"]
rustcrypto-p-curves = ["dep:p521"]
# DEPRECATED: superseded by `draft-ietf-hpke-pq`. Cannot be enabled together
# with it. Emits a build warning when used.
draft-connolly-cfrg-hpke-mlkem = []
# Post-quantum HPKE ciphersuites (SHAKE256 KDF, pure ML-KEM and the
# ML-KEM/ECDH hybrid KEMs) as used by the MLS PQ ciphersuites.
# <https://datatracker.ietf.org/doc/html/draft-ietf-hpke-pq>
draft-ietf-hpke-pq = []
std = [
    "rand/std",
    "libcrux-ecdh/std",
    "libcrux-kem/std",
    "hpke-rs-crypto/std",
]

[[bench]]
name = "bench_hkdf"
harness = false
required-features = ["sys-rng"]

[[bench]]
name = "bench_p256"
harness = false
required-features = ["sys-rng"]

[[bench]]
name = "bench_x25519"
harness = false
required-features = ["sys-rng"]
